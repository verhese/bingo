services:
  web:
    build:
      context: .
    command: npm start
    ports:
      - "3000:3000"
    environment:
      GAME_SERVER_WS_URL: ws://ws-server:3001
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}
    depends_on:
      - ws-server
    restart: unless-stopped

  ws-server:
    build:
      context: .
    command: npm run start:ws
    ports:
      - "3001:3001"
    environment:
      WS_PORT: "3001"
      DATABASE_URL: postgres://bingo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}@postgres:5432/bingo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: bingo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only, for local development (`npm run dev:ws`). Remove for production.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
