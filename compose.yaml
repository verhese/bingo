services:
  web:
    build:
      context: .
    command: npm start
    ports:
      - "3000:3000"
    environment:
      GAME_SERVER_WS_URL: ws://ws-server:3001
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (minimum 16 characters)}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET (minimum 32 bytes)}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN (minimum 32 bytes)}
    depends_on:
      ws-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ws-server:
    build:
      context: .
    command: npm run start:ws
    ports:
      - "3001:3001"
    environment:
      WS_PORT: "3001"
      DATABASE_URL: postgres://bingo@postgres:5432/bingo
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN (minimum 32 bytes)}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: bingo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only, for local development (`npm run dev:ws`). Remove for production.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
