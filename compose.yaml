services:
  web:
    build:
      context: .
    command: npm start
    ports:
      - "3000:3000"
    environment:
      GAME_SERVER_WS_URL: ws://ws-server:3001
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:-}
    depends_on:
      - ws-server
    restart: unless-stopped

  ws-server:
    build:
      context: .
    command: npm run start:ws
    ports:
      - "3001:3001"
    environment:
      WS_PORT: "3001"
    restart: unless-stopped